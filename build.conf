# build.conf - fx-buildsh project configuration
# Generated configuration file for the BashFX3 build system
# 
# This file contains all project-specific settings that can be customized
# per project. Command-line options will override these values.

# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT IDENTITY
# ═══════════════════════════════════════════════════════════════════════════════

# Project name - used in comments and documentation
PROJECT_NAME="fx-buildsh"

# Project version - embedded in build artifacts
PROJECT_VERSION="2.0.0-dev"

# Project description - for documentation generation
PROJECT_DESCRIPTION="Enhanced modular build system"

# Project author - for attribution
PROJECT_AUTHOR="BashFX Build System"

# Project license - for header generation  
PROJECT_LICENSE="MIT"

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# Default output file name
OUTPUT_FILE="build-result.sh"

# Parts directory containing source modules
PARTS_DIR="parts"

# Build map file for module ordering and naming
BUILD_MAP="parts/build.map"

# ═══════════════════════════════════════════════════════════════════════════════
# OPERATIONAL SETTINGS  
# ═══════════════════════════════════════════════════════════════════════════════

# Default verbosity level (true/false)
DEFAULT_VERBOSE=false

# Default quiet mode (true/false) 
DEFAULT_QUIET=false

# Automatically create parts directory if missing (true/false)
AUTO_CREATE_PARTS_DIR=true

# Maximum file size limit for module validation (in bytes)
MAX_MODULE_SIZE=1048576

# Enable syntax checking during build (true/false)
ENABLE_SYNTAX_CHECK=true

# ═══════════════════════════════════════════════════════════════════════════════
# QUARANTINE SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════

# Quarantine subdirectory name
QUARANTINE_DIR=".invalid"

# Enable quarantine metadata tracking (true/false)
QUARANTINE_METADATA=true

# ═══════════════════════════════════════════════════════════════════════════════
# MODULE NAMING AND VALIDATION
# ═══════════════════════════════════════════════════════════════════════════════

# Valid position range for modules
MIN_MODULE_POSITION=1
MAX_MODULE_POSITION=99

# Module filename pattern (for validation)
MODULE_PATTERN="^[0-9]+_.*\.sh$"

# File extensions to recognize as modules
MODULE_EXTENSIONS=".sh"

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD MAP SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Auto-generate build.map if missing (true/false)
AUTO_GENERATE_BUILD_MAP=false

# Build map header template
BUILD_MAP_HEADER="# Build Map - Generated by build.sh"

# Build map format specification 
BUILD_MAP_FORMAT="# Format: NN : target_filename.sh"

# ═══════════════════════════════════════════════════════════════════════════════
# OUTPUT CUSTOMIZATION
# ═══════════════════════════════════════════════════════════════════════════════

# Include generation timestamp in output (true/false)
INCLUDE_TIMESTAMP=true

# Include module list in output header (true/false)
INCLUDE_MODULE_LIST=true

# Custom shebang for output files (leave empty for default)
CUSTOM_SHEBANG=""

# Module separator comment style
MODULE_SEPARATOR_STYLE="# === %s ==="

# ═══════════════════════════════════════════════════════════════════════════════
# SAFETY AND VALIDATION  
# ═══════════════════════════════════════════════════════════════════════════════

# Blocked system paths for security
BLOCKED_PATHS="/etc:/usr:/var:/root:/sys:/proc:/dev:/bin:/sbin:/lib:/lib64:/boot:/run"

# Require confirmation for potentially destructive operations (true/false)
REQUIRE_CONFIRMATION=true

# Enable backup creation before destructive operations (true/false)
CREATE_BACKUPS=true

# Backup directory for safety operations
BACKUP_DIR=".backups"

# ═══════════════════════════════════════════════════════════════════════════════
# LOGO AND BRANDING SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Show startup banner by default (true/false)
SHOW_STARTUP_BANNER=false

# Default logo style for branding (banner/logo-only/compact/minimal)
DEFAULT_LOGO_STYLE="banner"

# Logo display alignment for banner mode (left/center/right)  
LOGO_ALIGNMENT="center"